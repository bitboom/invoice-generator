<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invoice Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&family=Archivo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>
  :root{
    --ink:#0a0a0a;
    --ink-2:#1a1a1a;
    --paper:#ffffff;
    --bg:#eceae5;
    --bg-2:#f5f3ee;
    --line:#d8d5cd;
    --line-2:#e6e3dc;
    --muted:#6b6b6b;
    --muted-2:#9a9a96;
    --accent:#0a0a0a;
    --field:#ffffff;
    --shadow: 0 30px 80px -30px rgba(0,0,0,0.18), 0 4px 16px -4px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-feature-settings: "tnum" 1, "ss01" 1;
  }
  /* ---------- App shell ---------- */
  .app{
    display:grid;
    grid-template-columns: 420px 1fr;
    min-height:100vh;
  }
  .panel{
    background:var(--bg-2);
    border-right:1px solid var(--line);
    padding:28px 28px 120px;
    height:100vh;
    overflow-y:auto;
    position:sticky;
    top:0;
  }
  .stage{
    padding:48px 48px 120px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:32px;
    min-width:0;
  }

  /* ---------- Panel header ---------- */
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .brand-mark{
    width:28px;height:28px;
    background:var(--ink);
    color:#fff;
    display:grid;place-items:center;
    border-radius:4px;
    font-weight:800;
    font-family:'Archivo',sans-serif;
    letter-spacing:-0.02em;
    font-size:13px;
  }
  .brand-name{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .panel h1{
    font-family:'Archivo',sans-serif;
    font-weight:900;
    font-size:34px;
    letter-spacing:-0.03em;
    margin:0 0 4px;
    line-height:1;
  }
  .panel-sub{
    color:var(--muted);
    font-size:13px;
    margin:0 0 24px;
    line-height:1.5;
  }

  /* ---------- Section ---------- */
  .section{
    margin-top:24px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  .section:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .section-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--muted);
    font-weight:700;
    margin:0 0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  /* ---------- Template picker ---------- */
  .templates{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:8px;
  }
  .tpl{
    cursor:pointer;
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 8px 10px;
    background:#fff;
    transition: all .15s ease;
    text-align:left;
  }
  .tpl:hover{border-color:#999}
  .tpl.active{
    border-color:var(--ink);
    box-shadow: 0 0 0 1px var(--ink);
  }
  .tpl-thumb{
    width:100%;
    aspect-ratio: 3/4;
    background:#fff;
    border:1px solid var(--line-2);
    border-radius:3px;
    margin-bottom:8px;
    overflow:hidden;
    position:relative;
  }
  .tpl-name{
    font-size:11px;
    font-weight:600;
    line-height:1.2;
    margin:0;
  }
  .tpl-desc{
    font-size:10px;
    color:var(--muted);
    margin:2px 0 0;
    line-height:1.3;
  }

  /* Thumbnails */
  .thumb-classic{
    background:linear-gradient(to right, var(--thumb-theme, #0a0a0a) 30%, #fff 30%);
    height:100%;
    position:relative;
  }
  .thumb-classic::before{
    content:'';
    position:absolute;
    left:8%;top:18%;
    width:14%;height:14%;
    background:#fff;
    border-radius:1px;
  }
  .thumb-classic::after{
    content:'';
    position:absolute;
    left:35%;top:14%;
    width:50%;height:8%;
    background:var(--thumb-theme, #0a0a0a);
  }
  .thumb-minimal{
    background:#fff;
    height:100%;
    position:relative;
    padding:10% 12%;
  }
  .thumb-minimal::before{
    content:'';
    position:absolute;
    top:14%;left:12%;right:12%;
    height:2px;
    background:#0a0a0a;
  }
  .thumb-minimal::after{
    content:'';
    position:absolute;
    top:20%;left:12%;
    width:30%;height:6%;
    background:#0a0a0a;
  }
  .thumb-bold{
    background:#fff;
    height:100%;
    position:relative;
  }
  .thumb-bold::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:22%;
    background:var(--thumb-theme, #0a0a0a);
  }
  .thumb-bold::after{
    content:'';
    position:absolute;
    top:30%;left:10%;
    width:35%;height:4%;
    background:var(--thumb-theme, #0a0a0a);
  }
  /* mini lines on thumbs */
  .thumb-lines{position:absolute;left:12%;right:12%;bottom:18%;display:flex;flex-direction:column;gap:3px}
  .thumb-lines span{display:block;height:2px;background:#d8d5cd;border-radius:1px}
  .thumb-lines span:nth-child(1){width:90%}
  .thumb-lines span:nth-child(2){width:75%}
  .thumb-lines span:nth-child(3){width:60%}
  .thumb-classic .thumb-lines{left:35%;right:8%;bottom:30%}
  .thumb-classic .thumb-lines span{background:#bdb9b0}

  /* ---------- Form fields ---------- */
  .field{
    display:flex;
    flex-direction:column;
    gap:5px;
    margin-bottom:10px;
  }
  .field label{
    font-size:11px;
    font-weight:600;
    color:#3a3a3a;
    letter-spacing:0.01em;
  }
  .field input, .field textarea{
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
    background:var(--field);
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
    outline:none;
    width:100%;
    transition: border-color .12s ease;
  }
  .field input[type="file"]{
    padding:7px 8px;
    font-size:12px;
  }
  .field input[type="color"]{
    width:38px;
    height:30px;
    padding:2px;
    border-radius:5px;
    cursor:pointer;
  }
  .help-text{
    margin:2px 0 0;
    color:var(--muted);
    font-size:11px;
    line-height:1.45;
  }
  .logo-control-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 10px;
  }
  .logo-preview-box{
    width:92px;
    height:48px;
    border:1px solid var(--line);
    border-radius:5px;
    background:#fff;
    display:grid;
    place-items:center;
    overflow:hidden;
    color:var(--muted-2);
    font-size:11px;
  }
  .logo-preview-box img{
    max-width:82px;
    max-height:38px;
    object-fit:contain;
  }
  .add-btn.compact{
    margin-top:0;
    padding:7px 10px;
  }
  .add-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
  }
  .palette{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .swatch{
    width:26px;
    height:26px;
    border-radius:999px;
    border:2px solid #fff;
    box-shadow:0 0 0 1px var(--line);
    cursor:pointer;
  }
  .swatch.active{
    box-shadow:0 0 0 2px var(--ink);
  }
  .field input:focus, .field textarea:focus{
    border-color:var(--ink);
  }
  .field textarea{
    resize:vertical;
    min-height:64px;
    line-height:1.5;
  }
  .field-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
  }
  .field-row-3{
    display:grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap:10px;
  }

  /* ---------- Items editor ---------- */
  .items-editor{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .item-row{
    display:grid;
    grid-template-columns: 1fr 80px 60px 90px 24px;
    gap:6px;
    align-items:center;
  }
  .item-row input{
    font-family:inherit;
    font-size:12px;
    background:var(--field);
    border:1px solid var(--line);
    border-radius:4px;
    padding:7px 8px;
    outline:none;
    width:100%;
  }
  .item-row input[type="number"]{text-align:right}
  .item-row input:focus{border-color:var(--ink)}
  .item-head{
    display:grid;
    grid-template-columns: 1fr 80px 60px 90px 24px;
    gap:6px;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-weight:700;
    color:var(--muted);
    margin-bottom:2px;
  }
  .item-head span:nth-child(2),
  .item-head span:nth-child(3),
  .item-head span:nth-child(4){text-align:right}
  .icon-btn{
    border:none;
    background:transparent;
    color:var(--muted-2);
    cursor:pointer;
    width:24px;height:24px;
    display:grid;place-items:center;
    border-radius:4px;
    font-size:14px;
    line-height:1;
    padding:0;
  }
  .icon-btn:hover{background:#0a0a0a10;color:var(--ink)}
  .add-btn{
    margin-top:6px;
    background:#fff;
    border:1px dashed var(--line);
    color:#3a3a3a;
    font-family:inherit;
    font-size:12px;
    font-weight:500;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
    transition:all .12s ease;
  }
  .add-btn:hover{border-color:var(--ink);border-style:solid}

  /* ---------- Sticky action bar ---------- */
  .actionbar{
    position:fixed;
    bottom:0;left:0;width:420px;
    padding:14px 28px 18px;
    background: linear-gradient(to top, var(--bg-2) 70%, transparent);
    display:flex;
    gap:8px;
    z-index:10;
    border-right:1px solid var(--line);
  }
  .btn{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    padding:11px 14px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    transition: all .12s ease;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .btn-primary{
    background:var(--ink);
    color:#fff;
    flex:1;
  }
  .btn-primary:hover{background:#000}
  .btn-primary:disabled{opacity:.6;cursor:wait}
  .btn-ghost{
    background:#fff;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--ink)}

  /* ---------- Stage chrome ---------- */
  .stage-toolbar{
    width: min(800px, 100%);
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--muted);
    font-size:12px;
    letter-spacing:0.04em;
  }
  .stage-toolbar .dot{
    display:inline-block;
    width:6px;height:6px;border-radius:50%;
    background:#22c55e;
    margin-right:6px;
    box-shadow:0 0 0 3px #22c55e22;
  }
  .zoom-controls{display:flex;gap:6px;align-items:center}
  .zoom-controls button{
    background:#fff;
    border:1px solid var(--line);
    width:28px;height:28px;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    color:var(--ink);
    display:grid;place-items:center;
  }
  .zoom-controls button:hover{border-color:var(--ink)}
  .zoom-label{font-variant-numeric:tabular-nums;width:48px;text-align:center}

  .invoice-frame{
    background:var(--paper);
    box-shadow: var(--shadow);
    transform-origin: top center;
    transition: transform .15s ease;
  }

  /* ============================================================
     INVOICE TEMPLATES — fixed A4ish dimensions: 794 × 1123 (96dpi)
     ============================================================ */
  .invoice{
    width:794px;
    height:1123px;
    background:#fff;
    color:#0a0a0a;
    font-family:'Pretendard', sans-serif;
    position:relative;
    overflow:hidden;
    --theme:#0a0a0a;
    --on-theme:#ffffff;
  }
  .uploaded-logo{
    display:block;
    max-width:160px;
    max-height:62px;
    object-fit:contain;
  }
  .logo-fallback{
    display:inline-flex;
    min-width:86px;
    min-height:34px;
    align-items:center;
    justify-content:center;
    border:1px solid currentColor;
    padding:8px 12px;
    font-family:'Archivo', sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    text-align:center;
    line-height:1.1;
  }

  /* ============= TEMPLATE 1 — CLASSIC (original) ============= */
  .tpl-classic{
    display:grid;
    grid-template-columns: 200px 1fr;
  }
  .tpl-classic .sidebar{
    background:var(--theme);
    color:var(--on-theme);
    padding:60px 24px 86px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .tpl-classic .sidebar-logo .uploaded-logo,
  .tpl-classic .sidebar-logo .logo-fallback{
    max-width:150px;
    max-height:128px;
    margin:30px auto 0;
    color:var(--on-theme);
  }
  .tpl-classic .sidebar-logo .uploaded-logo{
    width:auto;
  }
  .tpl-classic .sidebar-logo .logo-fallback{
    display:flex;
  }
  .tpl-classic .sidebar-bank{
    color:var(--on-theme);
    font-size:11px;
    line-height:1.55;
  }
  .tpl-classic .sidebar-bank .bk-label{
    font-size:13px;
    font-weight:800;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:2px solid var(--on-theme);
    display:inline-block;
    padding-right:30px;
  }
  .tpl-classic .sidebar-bank .bk-block{margin-top:18px}
  .tpl-classic .sidebar-bank .bk-block strong{font-weight:800;display:block;font-size:12.5px;margin-bottom:2px}

  .tpl-classic .body{
    padding:88px 50px 40px 40px;
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .tpl-classic .title-row{
    display:flex;
    align-items:flex-start;
    gap:22px;
    margin-bottom:30px;
  }
  .tpl-classic .title-row h1{
    font-family:'Archivo', sans-serif;
    font-weight:900;
    font-size:60px;
    letter-spacing:-0.03em;
    margin:0;
    line-height:0.95;
  }
  .tpl-classic .title-row .date{
    font-size:11px;
    margin-top:26px;
    line-height:1.35;
  }
  .tpl-classic .title-row .date strong{font-weight:800;display:block}

  .tpl-classic .info-block{margin-bottom:18px}
  .tpl-classic .info-head{
    font-size:13px;
    font-weight:800;
    margin:0 0 6px;
    padding-bottom:6px;
    border-bottom:3px solid var(--theme);
  }
  .tpl-classic .company-name{font-weight:800}
  .tpl-classic .info-grid{
    font-size:12px;
    line-height:1.85;
  }
  .tpl-classic .info-grid .row{display:flex;gap:14px}
  .tpl-classic .info-grid .row .lab{font-weight:800;min-width:64px}
  /* items table */
  .tpl-classic .items{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
    font-size:12px;
  }
  .tpl-classic .items thead th{
    text-align:left;
    font-weight:800;
    padding:10px 0 8px;
    border-bottom:3px solid var(--theme);
    font-size:12.5px;
  }
  .tpl-classic .items thead th.num{text-align:right}
  .tpl-classic .items tbody td{
    padding:14px 0;
    border-bottom:1px solid #e6e3dc;
    font-size:12px;
  }
  .tpl-classic .items tbody tr.alt td{
    background:#eceae5;
  }
  .tpl-classic .items tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
  .tpl-classic .items tbody td.empty{
    padding:0;
    height:38px;
    border-bottom:1px solid #e6e3dc;
  }
  .tpl-classic .total-rule{
    margin-top:34px;
    border-top:3px solid var(--theme);
    width:100%;
  }

  /* totals */
  .tpl-classic .totals{
    margin-top:10px;
    margin-left:auto;
    width:36%;
    font-size:12px;
  }
  .tpl-classic .totals .tr{
    display:grid;
    grid-template-columns: 1fr auto;
    padding:6px 0;
  }
  .tpl-classic .totals .lab{font-weight:800}
  .tpl-classic .totals .val{font-variant-numeric:tabular-nums}
  .tpl-classic .totals .sep{border-top:1px solid #0a0a0a;margin:4px 0}
  .tpl-classic .totals .grand{
    margin-top:6px;
    padding-top:10px;
    border-top:1.5px solid var(--theme);
  }
  .tpl-classic .totals .grand .lab{font-size:13px}

  .tpl-classic .footnote{
    margin-top:auto;
    border-top:1px solid var(--theme);
    padding-top:14px;
    background:#fff;
    font-size:10.5px;
    line-height:1.85;
    color:#0a0a0a;
  }
  .tpl-classic .footnote p{margin:0}

  /* ============= TEMPLATE 2 — MINIMAL ============= */
  .tpl-minimal{
    padding:64px 64px 0;
    display:flex;
    flex-direction:column;
    gap:0;
    position:relative;
  }
  .tpl-minimal .head{
    display:grid;
    grid-template-columns: 1fr auto;
    align-items:flex-end;
    border-bottom:2px solid var(--theme);
    padding-bottom:22px;
  }
  .tpl-minimal .head .uploaded-logo,
  .tpl-minimal .head .logo-fallback{
    max-height:44px;
    max-width:180px;
    color:var(--theme);
  }
  .tpl-minimal .head h1{
    font-family:'Archivo', sans-serif;
    font-weight:300;
    font-size:46px;
    letter-spacing:0.18em;
    margin:0;
    line-height:1;
    text-transform:uppercase;
  }
  .tpl-minimal .meta{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap:32px;
    margin-top:28px;
    padding-bottom:28px;
    border-bottom:1px solid #d8d5cd;
    font-size:11.5px;
    line-height:1.7;
  }
  .tpl-minimal .meta .col-head{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.18em;
    font-weight:700;
    color:#9a9a96;
    margin-bottom:10px;
  }
  .tpl-minimal .meta strong{font-weight:700;display:block;margin-bottom:1px}
  .tpl-minimal .meta .row{margin-bottom:8px}

  .tpl-minimal .work{
    margin-top:24px;
    padding-bottom:24px;
    border-bottom:1px solid #d8d5cd;
  }
  .tpl-minimal .work .col-head{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.18em;
    font-weight:700;
    color:#9a9a96;
    margin-bottom:10px;
  }
  .tpl-minimal .work-grid{
    display:grid;
    grid-template-columns: 60px 1fr;
    row-gap:6px;
    column-gap:14px;
    font-size:12px;
    line-height:1.6;
  }
  .tpl-minimal .work-grid .lab{font-weight:700}

  .tpl-minimal .items{
    width:100%;
    border-collapse:collapse;
    margin-top:24px;
    font-size:12px;
  }
  .tpl-minimal .items thead th{
    text-align:left;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.18em;
    font-weight:700;
    color:#9a9a96;
    padding:0 0 10px;
    border-bottom:1px solid #d8d5cd;
  }
  .tpl-minimal .items thead th.num{text-align:right}
  .tpl-minimal .items tbody td{
    padding:14px 0;
    border-bottom:1px solid #f0eee8;
    font-size:12.5px;
  }
  .tpl-minimal .items tbody td.num{text-align:right;font-variant-numeric:tabular-nums}

  .tpl-minimal .bottom{
    position:absolute;
    left:64px;
    right:64px;
    bottom:102px;
    display:grid;
    grid-template-columns: 1fr 280px;
    gap:32px;
  }
  .tpl-minimal .bank{
    font-size:11.5px;
    line-height:1.7;
  }
  .tpl-minimal .bank .col-head{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.18em;
    font-weight:700;
    color:#9a9a96;
    margin-bottom:10px;
  }
  .tpl-minimal .bank strong{font-weight:700}

  .tpl-minimal .totals{
    font-size:12.5px;
  }
  .tpl-minimal .totals .tr{
    display:grid;
    grid-template-columns: 1fr auto;
    padding:6px 0;
    color:#3a3a3a;
  }
  .tpl-minimal .totals .grand{
    margin-top:8px;
    padding-top:12px;
    border-top:2px solid var(--theme);
    font-weight:800;
    font-size:14px;
    color:#0a0a0a;
  }
  .tpl-minimal .totals .val{font-variant-numeric:tabular-nums}

  .tpl-minimal .footnote{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:96px;
    box-sizing:border-box;
    padding:14px 64px 16px;
    border-top:1px solid #d8d5cd;
    background:#fff;
    font-size:10.5px;
    line-height:1.55;
    color:#3a3a3a;
    columns: 2;
    column-gap:24px;
  }
  .tpl-minimal .footnote p{margin:0;break-inside:avoid}

  /* ============= TEMPLATE 3 — BOLD HEADER ============= */
  .tpl-bold{
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .tpl-bold .topbar{
    background:var(--theme);
    color:var(--on-theme);
    padding:32px 50px 30px;
    display:grid;
    grid-template-columns: 1fr auto;
    align-items:center;
    gap:20px;
  }
  .tpl-bold .topbar .uploaded-logo,
  .tpl-bold .topbar .logo-fallback{
    max-height:52px;
    max-width:190px;
    color:var(--on-theme);
  }
  .tpl-bold .topbar .uploaded-logo{
  }
  .tpl-bold .topbar .title{
    text-align:right;
  }
  .tpl-bold .topbar h1{
    font-family:'Archivo', sans-serif;
    font-weight:900;
    font-size:42px;
    letter-spacing:-0.02em;
    margin:0;
    line-height:1;
  }
  .tpl-bold .topbar .date{
    font-size:11px;
    margin-top:6px;
    color:var(--on-theme);
    opacity:.78;
    letter-spacing:0.08em;
  }
  .tpl-bold .body{
    padding:34px 50px 0;
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .tpl-bold .row-2{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:32px;
    margin-bottom:28px;
  }
  .tpl-bold .card{
    border-left:3px solid var(--theme);
    padding-left:14px;
  }
  .tpl-bold .card .col-head{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.18em;
    font-weight:800;
    color:var(--theme);
    margin-bottom:8px;
  }
  .tpl-bold .card .body-text{
    font-size:11.5px;
    line-height:1.7;
  }
  .tpl-bold .card strong{font-weight:700;display:inline-block;min-width:70px}

  .tpl-bold .work-grid{
    display:grid;
    grid-template-columns: 60px 1fr;
    row-gap:6px;
    column-gap:14px;
    font-size:11.5px;
    line-height:1.6;
  }
  .tpl-bold .work-grid .lab{font-weight:700}

  .tpl-bold .items{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
    margin-top:6px;
  }
  .tpl-bold .items thead th{
    background:#f5f3ee;
    text-align:left;
    font-weight:800;
    padding:12px 14px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.12em;
  }
  .tpl-bold .items thead th.num{text-align:right}
  .tpl-bold .items tbody td{
    padding:14px;
    border-bottom:1px solid #ece9e3;
    font-size:12.5px;
  }
  .tpl-bold .items tbody td.num{text-align:right;font-variant-numeric:tabular-nums}

  .tpl-bold .bottom{
    position:absolute;
    left:50px;
    right:50px;
    bottom:132px;
    display:grid;
    grid-template-columns: 1fr 320px;
    gap:32px;
    align-items:flex-start;
  }
  .tpl-bold .bank{
    font-size:11.5px;
    line-height:1.7;
    padding:18px 20px;
    border:1px solid #d8d5cd;
    border-radius:4px;
  }
  .tpl-bold .bank .col-head{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.18em;
    font-weight:800;
    margin-bottom:8px;
  }
  .tpl-bold .totals-card{
    background:var(--theme);
    color:var(--on-theme);
    padding:20px 22px;
    border-radius:4px;
    font-size:12.5px;
  }
  .tpl-bold .totals-card .tr{
    display:grid;
    grid-template-columns: 1fr auto;
    padding:6px 0;
    color:var(--on-theme);
    opacity:.74;
  }
  .tpl-bold .totals-card .grand{
    margin-top:10px;
    padding-top:12px;
    border-top:1px solid #ffffff44;
    color:var(--on-theme);
    opacity:1;
    font-weight:800;
    font-size:15px;
  }
  .tpl-bold .totals-card .val{font-variant-numeric:tabular-nums}
  .tpl-bold .footnote{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:108px;
    box-sizing:border-box;
    padding:14px 50px 16px;
    border-top:1px solid #d8d5cd;
    background:#fff;
    font-size:10.5px;
    line-height:1.55;
    color:#3a3a3a;
  }
  .tpl-bold .footnote p{margin:0}

  /* shared empty rows for classic (visible placeholder lines) */
  .empty-bars{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .empty-bars span{display:block;height:34px;background:#eceae5}

  /* responsive guard */
  @media (max-width: 1100px){
    .app{grid-template-columns: 1fr}
    .panel{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line)}
    .actionbar{position:sticky;width:100%;border-right:none;border-top:1px solid var(--line);bottom:0}
    .stage{padding:32px 16px 80px}
  }

  /* toast */
  .toast{
    position:fixed;
    bottom:24px;right:24px;
    background:var(--ink);
    color:#fff;
    padding:12px 16px;
    border-radius:6px;
    font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
    z-index:50;
    display:flex;
    align-items:center;
    gap:8px;
    animation: toast-in .2s ease;
  }
  @keyframes toast-in{from{transform:translateY(8px);opacity:0}}
</style>
</head>
